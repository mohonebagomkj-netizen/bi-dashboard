<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>小红书 BI 看板</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #111831;
      --panel2:#0f1630;
      --text: #e8eefc;
      --muted:#97a3c4;
      --accent:#6aa6ff;
      --good:#46d39a;
      --bad:#ff6b6b;
      --border: rgba(255,255,255,.08);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);}
    header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;}
    header h1{margin:0;font-size:18px;}
    header .sub{color:var(--muted);font-size:12px;}
    .wrap{padding:16px 16px 28px;max-width:1200px;margin:0 auto;}
    .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
    .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:12px;padding:12px 12px 10px;min-height:74px;}
    .k{color:var(--muted);font-size:12px;margin-bottom:6px;}
    .v{font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:10px;}
    .delta{font-size:12px;font-weight:600;}
    .delta.good{color:var(--good);}
    .delta.bad{color:var(--bad);}
    .delta.na{color:var(--muted);font-weight:500;}
    .charts{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:12px;}
    .panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:12px;padding:10px;}
    .panel h2{margin:4px 6px 10px;font-size:13px;color:var(--muted);font-weight:600;}
    .chart{height:320px;}
    .chart.sm{height:260px;}
    @media (max-width:1100px){.grid{grid-template-columns:repeat(3,1fr);}.charts{grid-template-columns:1fr;}}
    @media (max-width:600px){.grid{grid-template-columns:repeat(2,1fr);}}
  </style>
</head>
<body>
  <header>
    <h1>小红书 BI 看板</h1>
    <div class="sub" id="range"></div>
  </header>
  <div class="wrap">
    <div class="grid" id="kpis"></div>

    <div class="charts">
      <div class="panel">
        <h2>趋势（DAU / 新增 / 充值）</h2>
        <div id="trend" class="chart"></div>
      </div>
      <div class="panel">
        <h2>留存（D1/D3/D7）</h2>
        <div id="ret" class="chart"></div>
      </div>
      <div class="panel">
        <h2>充值拆分（自然/内导/渠道）</h2>
        <div id="charge_split" class="chart sm"></div>
      </div>
      <div class="panel">
        <h2>质量（新增观影率/广告点击率/iOS占比）</h2>
        <div id="quality" class="chart sm"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script>
  const payload = {"kpis": {"range": {"start": "2026-03-01", "end": "2026-03-30", "days": 30}, "dau": {"value": 30339.0, "mom": -0.2890852001124754}, "new_users": {"value": 5658.0, "mom": -0.35558086560364466}, "charge_total": {"value": 4120.0, "mom": -0.2196969696969697}, "ret_d1": {"value": null, "mom": -1.0}, "new_view_rate": {"value": 0.8678, "mom": -0.006866559853513269}, "ad_click_rate": {"value": 0.1265, "mom": -0.1394557823129251}, "ios_share": {"value": 0.3613, "mom": 0.24457457802273513}}, "series": {"date": ["2026-03-01", "2026-03-02", "2026-03-03", "2026-03-04", "2026-03-05", "2026-03-06", "2026-03-07", "2026-03-08", "2026-03-09", "2026-03-10", "2026-03-11", "2026-03-12", "2026-03-13", "2026-03-14", "2026-03-15", "2026-03-16", "2026-03-17", "2026-03-18", "2026-03-19", "2026-03-20", "2026-03-21", "2026-03-22", "2026-03-23", "2026-03-24", "2026-03-25", "2026-03-26", "2026-03-27", "2026-03-28", "2026-03-29", "2026-03-30"], "dau": [74660.0, 65602.0, 64453.0, 58904.0, 51481.0, 57284.0, 69732.0, 66738.0, 46499.0, 45112.0, 46230.0, 46179.0, 55522.0, 68700.0, 64881.0, 44721.0, 45041.0, 44855.0, 45074.0, 52260.0, 56907.0, 51077.0, 35615.0, 34579.0, 35062.0, 33877.0, 39460.0, 45171.0, 42676.0, 30339.0], "new_users": [17732.0, 15405.0, 14599.0, 13194.0, 10962.0, 12600.0, 17569.0, 15629.0, 10433.0, 9203.0, 9499.0, 9456.0, 12420.0, 19843.0, 18692.0, 10947.0, 10463.0, 10240.0, 10343.0, 12466.0, 13378.0, 10680.0, 6916.0, 6718.0, 6975.0, 6573.0, 8154.0, 9778.0, 8780.0, 5658.0], "charge_total": [9220.0, 7130.0, 6520.0, 8190.0, 4780.0, 4210.0, 8440.0, 12660.0, 7720.0, 7220.0, 8100.0, 6820.0, 8330.0, 8190.0, 8070.0, 8370.0, 7570.0, 6520.0, 5010.0, 5620.0, 6670.0, 5130.0, 5620.0, 4290.0, 3510.0, 3190.0, 5900.0, 6160.0, 5280.0, 4120.0], "charge_org": [2070.0, 2070.0, 730.0, 1700.0, 430.0, 650.0, 1740.0, 2260.0, 1550.0, 1580.0, 2380.0, 1380.0, 2240.0, 1900.0, 2110.0, 2740.0, 1610.0, 1290.0, 820.0, 1610.0, 1970.0, 1060.0, 1420.0, 1120.0, 780.0, 610.0, 1740.0, 1810.0, 1980.0, 950.0], "charge_internal": [100.0, 80.0, 50.0, 0.0, 100.0, 50.0, 0.0, 50.0, 350.0, 250.0, 0.0, 100.0, 50.0, 150.0, 50.0, 100.0, 100.0, 0.0, 0.0, 0.0, 30.0, 50.0, 100.0, 50.0, 0.0, 240.0, 100.0, 0.0, 0.0, 100.0], "charge_channel": [7050.0, 4980.0, 5740.0, 6490.0, 4250.0, 3510.0, 6700.0, 10350.0, 5820.0, 5390.0, 5720.0, 5340.0, 6040.0, 6140.0, 5910.0, 5530.0, 5860.0, 5230.0, 4190.0, 4010.0, 4670.0, 4020.0, 4100.0, 3120.0, 2730.0, 2340.0, 4060.0, 4350.0, 3300.0, 3070.0], "ret_d1": [0.1527, 0.1697, 0.1553, 0.1523, 0.16, 0.2026, 0.19329999999999997, 0.13369999999999999, 0.1777, 0.16940000000000002, 0.163, 0.1666, 0.1981, 0.1984, 0.1394, 0.1748, 0.1759, 0.1714, 0.1777, 0.2011, 0.1714, 0.11199999999999999, 0.1524, 0.1594, 0.16260000000000002, 0.1629, 0.2073, 0.17980000000000002, 0.1134, null], "ret_d3": [0.0832, 0.07730000000000001, 0.0823, 0.0909, 0.0911, 0.0765, 0.0788, 0.08839999999999999, 0.1112, 0.10210000000000001, 0.1014, 0.09269999999999999, 0.0692, 0.07490000000000001, 0.0911, 0.1014, 0.1759, 0.1026, 0.09970000000000001, 0.0663, 0.057800000000000004, 0.0673, 0.0895, 0.0875, 0.09519999999999999, 0.09369999999999999, 0.0717, null, null, null], "ret_d7": [0.0696, 0.0495, 0.0475, 0.0575, 0.0608, 0.083, 0.107, 0.09, 0.0733, 0.0692, 0.0642, 0.0669, 0.0812, 0.09759999999999999, 0.07730000000000001, 0.0635, 0.0621, 0.0641, 0.059800000000000006, 0.0732, 0.0916, 0.077, 0.0646, null, null, null, null, null, null, null], "new_view_rate": [0.892, 0.8942, 0.8886, 0.8912, 0.8981, 0.8855, 0.8953, 0.8951, 0.9025, 0.8979, 0.8974, 0.873, 0.8898, 0.8665, 0.8802, 0.8773000000000001, 0.8733, 0.8717, 0.8704000000000001, 0.8759, 0.8985, 0.9031999999999999, 0.8569, 0.8447, 0.848, 0.873, 0.8841, 0.8922, 0.8737999999999999, 0.8678], "ad_click_rate": [0.1412, 0.1402, 0.1434, 0.1363, 0.13449999999999998, 0.023799999999999998, 0.032799999999999996, 0.134, 0.1186, 0.1193, 0.1191, 0.1274, 0.1278, 0.135, 0.128, 0.1131, 0.11599999999999999, 0.1242, 0.1168, 0.1246, 0.1431, 0.13699999999999998, 0.1242, 0.1264, 0.1295, 0.1291, 0.1364, 0.1523, 0.147, 0.1265], "ios_share": [0.27449999999999997, 0.2933, 0.298, 0.3171, 0.3325, 0.27440000000000003, 0.2175, 0.27690000000000003, 0.34990000000000004, 0.3627, 0.3531, 0.3397, 0.30010000000000003, 0.205, 0.2094, 0.3015, 0.3015, 0.2914, 0.6312, 0.2662, 0.28, 0.31989999999999996, 0.3716, 0.3418, 0.34240000000000004, 0.3419, 0.3011, 0.2775, 0.2903, 0.3613]}};

  function fmtNumber(n) {
    if (n === null || n === undefined) return '-';
    const x = Number(n);
    if (!isFinite(x)) return '-';
    return x.toLocaleString('zh-CN');
  }
  function fmtMoney(n) {
    if (n === null || n === undefined) return '-';
    const x = Number(n);
    if (!isFinite(x)) return '-';
    return x.toLocaleString('zh-CN', {minimumFractionDigits:0, maximumFractionDigits:0});
  }
  function fmtPct(r) {
    if (r === null || r === undefined) return '-';
    const x = Number(r);
    if (!isFinite(x)) return '-';
    return (x*100).toFixed(2) + '%';
  }
  function fmtDelta(d) {
    if (d === null || d === undefined) return {cls:'na', text:'—'};
    const x = Number(d);
    if (!isFinite(x)) return {cls:'na', text:'—'};
    const pct = (x*100).toFixed(1) + '%';
    if (x > 0) return {cls:'good', text:'▲ ' + pct};
    if (x < 0) return {cls:'bad', text:'▼ ' + Math.abs(x*100).toFixed(1) + '%'};
    return {cls:'na', text:'0.0%'};
  }

  const r = payload.kpis.range;
  document.getElementById('range').textContent = `数据范围：${r.start} ～ ${r.end}（${r.days}天）`;

  const kpiDefs = [
    { key:'dau', label:'日活跃(最后一天)', fmt:fmtNumber },
    { key:'new_users', label:'日新增(最后一天)', fmt:fmtNumber },
    { key:'charge_total', label:'日总充值(最后一天)', fmt:fmtMoney },
    { key:'ret_d1', label:'次日留存率(最后一天)', fmt:fmtPct },
    { key:'new_view_rate', label:'新增观影率(最后一天)', fmt:fmtPct },
    { key:'ad_click_rate', label:'广告点击率(最后一天)', fmt:fmtPct },
  ];

  const kpisEl = document.getElementById('kpis');
  kpiDefs.forEach(def => {
    const item = payload.kpis[def.key];
    const d = fmtDelta(item.mom);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="k">${def.label}</div>
      <div class="v">
        <span>${def.fmt(item.value)}</span>
        <span class="delta ${d.cls}">${d.text}</span>
      </div>
    `;
    kpisEl.appendChild(card);
  });

  const dates = payload.series.date;

  const trend = echarts.init(document.getElementById('trend'));
  trend.setOption({
    tooltip: { trigger: 'axis' },
    legend: { textStyle: { color: '#cbd6ff' } },
    grid: { left: 50, right: 18, top: 30, bottom: 30 },
    xAxis: { type: 'category', data: dates, axisLabel: { color:'#97a3c4' } },
    yAxis: [
      { type: 'value', name:'人数', axisLabel: { color:'#97a3c4' } },
      { type: 'value', name:'充值', axisLabel: { color:'#97a3c4' } },
    ],
    series: [
      { name:'日活跃', type:'line', smooth:true, data: payload.series.dau, yAxisIndex:0 },
      { name:'日新增', type:'line', smooth:true, data: payload.series.new_users, yAxisIndex:0 },
      { name:'日总充值', type:'bar', data: payload.series.charge_total, yAxisIndex:1, itemStyle:{color:'#6aa6ff'} },
    ]
  });

  const ret = echarts.init(document.getElementById('ret'));
  ret.setOption({
    tooltip: { trigger:'axis', valueFormatter: v => (v==null?'-':(v*100).toFixed(2)+'%') },
    legend: { textStyle: { color: '#cbd6ff' } },
    grid: { left: 50, right: 18, top: 30, bottom: 30 },
    xAxis: { type: 'category', data: dates, axisLabel: { color:'#97a3c4' } },
    yAxis: { type: 'value', axisLabel: { formatter: v => (v*100).toFixed(0)+'%', color:'#97a3c4' } },
    series: [
      { name:'D1', type:'line', smooth:true, data: payload.series.ret_d1 },
      { name:'D3', type:'line', smooth:true, data: payload.series.ret_d3 },
      { name:'D7', type:'line', smooth:true, data: payload.series.ret_d7 },
    ]
  });

  const split = echarts.init(document.getElementById('charge_split'));
  split.setOption({
    tooltip: { trigger:'axis' },
    legend: { textStyle: { color: '#cbd6ff' } },
    grid: { left: 50, right: 18, top: 30, bottom: 30 },
    xAxis: { type:'category', data: dates, axisLabel: { color:'#97a3c4' } },
    yAxis: { type:'value', axisLabel: { color:'#97a3c4' } },
    series: [
      { name:'自然充值', type:'bar', stack:'c', data: payload.series.charge_org },
      { name:'内导充值', type:'bar', stack:'c', data: payload.series.charge_internal },
      { name:'渠道充值', type:'bar', stack:'c', data: payload.series.charge_channel },
    ]
  });

  const quality = echarts.init(document.getElementById('quality'));
  quality.setOption({
    tooltip: { trigger:'axis', valueFormatter: v => (v==null?'-':(v*100).toFixed(2)+'%') },
    legend: { textStyle: { color: '#cbd6ff' } },
    grid: { left: 50, right: 18, top: 30, bottom: 30 },
    xAxis: { type:'category', data: dates, axisLabel: { color:'#97a3c4' } },
    yAxis: { type:'value', axisLabel: { formatter: v => (v*100).toFixed(0)+'%', color:'#97a3c4' } },
    series: [
      { name:'新增观影率', type:'line', smooth:true, data: payload.series.new_view_rate },
      { name:'广告点击率', type:'line', smooth:true, data: payload.series.ad_click_rate },
      { name:'iOS占比', type:'line', smooth:true, data: payload.series.ios_share },
    ]
  });

  window.addEventListener('resize', () => {
    trend.resize(); ret.resize(); split.resize(); quality.resize();
  });
  </script>
</body>
</html>
