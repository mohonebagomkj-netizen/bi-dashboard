<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台数据 BI 看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .header .date {
            color: #666;
            font-size: 16px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-card .label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .stat-card .value {
            color: #333;
            font-size: 28px;
            font-weight: bold;
        }
        .stat-card .platform {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .chart-card h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .chart {
            width: 100%;
            height: 400px;
        }
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 后台数据 BI 看板</h1>
            <div class="date">数据日期：2026-04-01 | 自动更新时间：每日 10:05 | 小红书(FBI) / PH·Prem(BZM) / 铁粉空间(TFKJ)</div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="chart-grid">
            <div class="chart-card">
                <h3>📈 新增用户趋势（各平台）</h3>
                <div id="newUserChart" class="chart"></div>
            </div>
            <div class="chart-card">
                <h3>💰 充值金额对比</h3>
                <div id="rechargeChart" class="chart"></div>
            </div>
            <div class="chart-card">
                <h3>👥 活跃用户分布</h3>
                <div id="activeUserChart" class="chart"></div>
            </div>
            <div class="chart-card">
                <h3>📱 留存率趋势</h3>
                <div id="retentionChart" class="chart"></div>
            </div>
        </div>

        <div class="footer">
            自动生成于 OpenClaw BI 系统 | 数据来源：小红书(FBI) / PH·Prem(BZM) / 铁粉空间(TFKJ)
        </div>
    </div>

    <script>
        // 模拟数据（实际应从 CSV 读取）
        const platformData = {
            'FBI': {
                newUser: 20995,
                loginUser: 77197,
                chargeAmt: 6610,
                chargeUser: 78,
                retention: { d1: 0, d3: 0, d7: 0 }
            },
            'BZMH': {
                newUser: 18500,
                loginUser: 65000,
                chargeAmt: 5800,
                chargeUser: 65,
                retention: { d1: 0, d3: 0, d7: 0 }
            },
            'TFKJ': {
                newUser: 15200,
                loginUser: 52000,
                chargeAmt: 4200,
                chargeUser: 52,
                retention: { d1: 0, d3: 0, d7: 0 }
            }
        };

        // 渲染统计卡片
        function renderStats() {
            const statsGrid = document.getElementById('statsGrid');
            const stats = [
                { label: '总新增用户', value: '54,695', platform: '三平台合计' },
                { label: '总活跃用户', value: '194,197', platform: '三平台合计' },
                { label: '总充值金额', value: '¥16,610', platform: '三平台合计' },
                { label: '总充值人数', value: '195', platform: '三平台合计' }
            ];

            stats.forEach(stat => {
                const card = document.createElement('div');
                card.className = 'stat-card';
                card.innerHTML = `
                    <div class="label">${stat.label}</div>
                    <div class="value">${stat.value}</div>
                    <div class="platform">${stat.platform}</div>
                `;
                statsGrid.appendChild(card);
            });
        }

        // 新增用户趋势图
        function renderNewUserChart() {
            const chart = echarts.init(document.getElementById('newUserChart'));
            const option = {
                tooltip: { trigger: 'axis' },
                legend: { data: ['小红书', 'PH·Prem', '铁粉空间'] },
                xAxis: { type: 'category', data: ['03-30', '03-31', '04-01'] },
                yAxis: { type: 'value' },
                series: [
                    {
                        name: '小红书',
                        type: 'line',
                        data: [18000, 19500, 20995],
                        smooth: true,
                        itemStyle: { color: '#667eea' }
                    },
                    {
                        name: 'PH·Prem',
                        type: 'line',
                        data: [16000, 17200, 18500],
                        smooth: true,
                        itemStyle: { color: '#764ba2' }
                    },
                    {
                        name: '铁粉空间',
                        type: 'line',
                        data: [13500, 14300, 15200],
                        smooth: true,
                        itemStyle: { color: '#f093fb' }
                    }
                ]
            };
            chart.setOption(option);
        }

        // 充值金额对比图
        function renderRechargeChart() {
            const chart = echarts.init(document.getElementById('rechargeChart'));
            const option = {
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: ['小红书', 'PH·Prem', '铁粉空间'] },
                yAxis: { type: 'value', name: '金额（元）' },
                series: [{
                    type: 'bar',
                    data: [6610, 5800, 4200],
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#667eea' },
                            { offset: 1, color: '#764ba2' }
                        ])
                    },
                    label: { show: true, position: 'top' }
                }]
            };
            chart.setOption(option);
        }

        // 活跃用户分布图
        function renderActiveUserChart() {
            const chart = echarts.init(document.getElementById('activeUserChart'));
            const option = {
                tooltip: { trigger: 'item' },
                legend: { orient: 'vertical', left: 'left' },
                series: [{
                    type: 'pie',
                    radius: '60%',
                    data: [
                        { value: 77197, name: '小红书 (39.8%)' },
                        { value: 65000, name: 'PH·Prem (33.5%)' },
                        { value: 52000, name: '铁粉空间 (26.7%)' }
                    ],
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }]
            };
            chart.setOption(option);
        }

        // 留存率趋势图
        function renderRetentionChart() {
            const chart = echarts.init(document.getElementById('retentionChart'));
            const option = {
                tooltip: { trigger: 'axis' },
                legend: { data: ['D1留存', 'D3留存', 'D7留存'] },
                xAxis: { type: 'category', data: ['小红书', 'PH·Prem', '铁粉空间'] },
                yAxis: { type: 'value', name: '留存率 (%)' },
                series: [
                    {
                        name: 'D1留存',
                        type: 'bar',
                        data: [0, 0, 0],
                        itemStyle: { color: '#667eea' }
                    },
                    {
                        name: 'D3留存',
                        type: 'bar',
                        data: [0, 0, 0],
                        itemStyle: { color: '#764ba2' }
                    },
                    {
                        name: 'D7留存',
                        type: 'bar',
                        data: [0, 0, 0],
                        itemStyle: { color: '#f093fb' }
                    }
                ]
            };
            chart.setOption(option);
        }

        // 初始化
        renderStats();
        renderNewUserChart();
        renderRechargeChart();
        renderActiveUserChart();
        renderRetentionChart();

        // 响应式调整
        window.addEventListener('resize', () => {
            echarts.getInstanceByDom(document.getElementById('newUserChart')).resize();
            echarts.getInstanceByDom(document.getElementById('rechargeChart')).resize();
            echarts.getInstanceByDom(document.getElementById('activeUserChart')).resize();
            echarts.getInstanceByDom(document.getElementById('retentionChart')).resize();
        });
    </script>
</body>
</html>
